name: 03-workflow-runners

on: push

jobs:
    unbuntu-echo:
        runs-on: ubuntu-latest
        steps:
            - name: Show the OS
              run: |
                echo "This job is running on an Unbuntu runner."
                echo "Runner OS: $RUNNER_OS"
    windows-echo:
        runs-on: windows-latest
        steps:
            - name: Show OS
              shell: bash
              run: |
                echo "This job is running on a Windows runner."
                echo "Runner OS: $RUNNER_OS"
